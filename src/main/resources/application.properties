spring.application.name=product

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:15432}/${POSTGRES_DB:problem_bank}
spring.datasource.username=${POSTGRES_USER:problem_bank}
spring.datasource.password=${POSTGRES_PASSWORD:problem_bank_local}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=2s
